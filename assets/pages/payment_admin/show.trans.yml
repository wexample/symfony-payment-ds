en:
  page_title: Payment
  page_icon: ph:bold/bank
  action:
    synchronize: Read again from the provider
    confirm: Mark as received
    cancel: Cancel
  confirm:
    synchronize: Read this payment again from its provider?
    confirm: Mark this payment as received? Do it once the money has arrived.
    cancel: Cancel this payment? The payer will have to pay again.
  done:
    synchronize: The payment was read again from its provider.
    confirm: The payment is marked as received.
    cancel: The payment is canceled.
    refund: The refund is done.
  refused:
    synchronize: The provider could not be read.
    confirm: The payment could not be marked as received.
    cancel: The payment could not be canceled.
  refund:
    title: Refund
  refunds: Refunds

fr:
  page_title: Paiement
  page_icon: ph:bold/bank
  action:
    synchronize: Relire chez le prestataire
    confirm: Marquer reçu
    cancel: Annuler
  confirm:
    synchronize: Relire ce paiement chez son prestataire ?
    confirm: Marquer ce paiement comme reçu ? À faire une fois l'argent arrivé.
    cancel: Annuler ce paiement ? Le payeur devra payer à nouveau.
  done:
    synchronize: Le paiement a été relu chez son prestataire.
    confirm: Le paiement est marqué reçu.
    cancel: Le paiement est annulé.
    refund: Le remboursement est fait.
  refused:
    synchronize: Le prestataire n'a pas pu être lu.
    confirm: Le paiement n'a pas pu être marqué reçu.
    cancel: Le paiement n'a pas pu être annulé.
  refund:
    title: Rembourser
  refunds: Remboursements

zh:
  page_title: 支付
  page_icon: 'ph:bold/bank'
  action:
    synchronize: 重新从提供方读取
    confirm: 标记为已收
    cancel: 取消
  confirm:
    synchronize: 是否重新从其提供方读取此支付？
    confirm: 是否将此支付标记为已收？在资金到达后进行操作。
    cancel: 是否取消此支付？付款人将需要重新付款。
  done:
    synchronize: 支付已重新从其提供方读取。
    confirm: 支付已标记为已收。
    cancel: 支付已取消。
    refund: 退款已完成。
  refused:
    synchronize: 无法读取提供方。
    confirm: 无法将支付标记为已收。
    cancel: 无法取消此支付。
  refund:
    title: 退款
  refunds: 退款

ar:
  page_title: الدفع
  page_icon: 'ph:bold/bank'
  action:
    synchronize: 'إعادة القراءة من المزود'
    confirm: 'تأكيد الاستلام'
    cancel: إلغاء
  confirm:
    synchronize: 'هل تريد إعادة قراءة هذه الدفعة من مزودها؟'
    confirm: 'هل تريد تأكيد استلام هذه الدفعة؟ قم بذلك بمجرد وصول الأموال.'
    cancel: 'هل تريد إلغاء هذه الدفعة؟ سيتعين على الدافع الدفع مرة أخرى.'
  done:
    synchronize: 'تمت إعادة قراءة الدفعة من مزودها.'
    confirm: 'تم تأكيد استلام الدفعة.'
    cancel: 'تم إلغاء الدفعة.'
    refund: 'تمت المعالجة.'
  refused:
    synchronize: 'لم يتمكن المزود من القراءة.'
    confirm: 'لم يتمكن من تأكيد استلام الدفعة.'
    cancel: 'لم يتمكن من إلغاء الدفعة.'
  refund:
    title: استرداد
  refunds: الاستردادات
